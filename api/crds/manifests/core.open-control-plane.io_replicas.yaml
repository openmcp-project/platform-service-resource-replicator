---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  labels:
    openmcp.cloud/cluster: platform
  name: replicas.core.open-control-plane.io
spec:
  group: core.open-control-plane.io
  names:
    kind: Replica
    listKind: ReplicaList
    plural: replicas
    shortNames:
    - rep
    singular: replica
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              interval:
                description: |-
                  Interval specifies how often the replica should be reconciled.
                  It is automatically reconciled when modified, but changes to the source resources are not automatically detected, so a periodic reconciliation is required to keep the replica up to date.
                  The default is 1h, set it to 0 to disable periodic reconciliation.
                type: string
              sources:
                description: Sources is a list of references to the resources which
                  should be combined into the replica.
                items:
                  properties:
                    group:
                      type: string
                    id:
                      description: |-
                        ID is a unique identifier for the reference.
                        It is used to refer to the resource in the template.
                      minLength: 1
                      type: string
                    kind:
                      type: string
                    name:
                      description: Name is the name of the object.
                      type: string
                    namespace:
                      description: Namespace is the namespace of the object.
                      type: string
                    version:
                      type: string
                  required:
                  - group
                  - id
                  - kind
                  - name
                  - version
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              targets:
                description: |-
                  Targets is a list of targets where replicas should be created.
                  Note that a single target can also resolve to multiple actual targets, e.g. if a cluster selector matches multiple clusters.
                  Targets should be disjunct, multiple target definitions causing the same target resource to be created will result in an error.
                  This is limited to 10 target definitions for now, as an unlimited list breaks the validation.
                items:
                  properties:
                    cluster:
                      description: |-
                        Cluster specifies Cluster resource(s) to target for the replica.
                        Can be omitted, in which case the platform cluster (where the operator runs) is targeted.
                      properties:
                        location:
                          description: |-
                            Location specifies where the target resource should be created.
                            It must be either 'Onto' or 'NextTo'.
                            If omitted, 'Onto' is assumed.
                            If it is 'Onto', the target resource is created on the cluster represented by the Cluster resource.
                            If it is 'NextTo', the target resource is created on the platform cluster, in the same namespace as the Cluster resource. This is incompatible with any namespace selectors.
                            Whether only one or multiple target resources are created for multiple matching Cluster resources in the same namespace when using 'NextTo' depends on whether the template generates different names for the different clusters' target resources.
                          enum:
                          - Onto
                          - NextTo
                          type: string
                        selector:
                          description: |-
                            Selector is a cluster selector for identifying the target Cluster resources.
                            If empty, all Cluster resources match.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchIdentities:
                              description: |-
                                MatchIdentities contains a list of object references and matches only the objects with the given identities.
                                If this selector is nil, all objects match.
                                If this selector is not nil, but the list is empty, no objects match.
                                If not nil, all other selector fields are ignored and only the identities are matched.
                              items:
                                description: ObjectReference is a reference to an
                                  object in any namespace.
                                properties:
                                  name:
                                    description: Name is the name of the object.
                                    type: string
                                  namespace:
                                    description: Namespace is the namespace of the
                                      object.
                                    type: string
                                required:
                                - name
                                - namespace
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                            matchPurposes:
                              description: |-
                                MatchPurposes contains a list of purpose selector requirements.
                                An empty or nil list matches all objects.
                                Duplicate purposes within a single requirement are ignored.
                                The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  operator:
                                    description: |-
                                      Operator represents how the list of purposes is matched against the values.
                                      Valid operators are: 'ContainsAll', 'ContainsAny', 'ContainsNone', 'Equals'.
                                    type: string
                                  values:
                                    description: |-
                                      Values is an array of string values.
                                      An empty or nil array will match no objects for 'ContainsAll' and 'ContainsAny',
                                      all objects for 'ContainsNone', and only objects with no purposes for 'Equals'.
                                      This array is replaced during a strategic merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                    namespace:
                      description: |-
                        Namespace specifies namespace(s) to target for the replica.
                        If this resolves to multiple namespaces, the replica will be created in each of them.
                        If omitted, the namespace must be specified in the template (except for the 'only one source, no template' case).
                      properties:
                        selector:
                          description: |-
                            Selector is a namespace selector for identifying the target namespaces.
                            Note that there is a difference between this being nil and this being an empty struct:
                            - If nil, no namespaces will be selected and the target resource's namespace must be specified in the template (except for the 'only one source, no template' case).
                            - If empty, this results in a namespace selector which matches all namespaces, and the target resource will be created in all of them.
                          nullable: true
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchIdentities:
                              description: |-
                                MatchIdentities specifies a list of namespace names to match.
                                If this is nil, the label selector applies.
                                If this is not nil, but empty, no namespaces match. This is rarely useful.
                                Otherwise, exactly the namespaces with the given names match.
                                Note that the label selector will be ignored if this is not nil.
                              items:
                                description: LocalObjectReference is a reference to
                                  an object in the same namespace as the resource
                                  referencing it.
                                properties:
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                type: object
                                x-kubernetes-map-type: atomic
                              nullable: true
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                    namespacePolicy:
                      description: |-
                        NamespacePolicy specifies what to do if the target namespace does not exist.
                        Has no effect if the rendered template results in a cluster-scoped resource.
                        If the namespaces are identified via a namespace selector, this only has an effect if 'matchIdentities' is used, otherwise only existing namespaces will be selected.
                        Valid values are:
                        - Create (default)
                            The target namespace will be created if it does not exist.
                        - Skip
                            The target namespace will be skipped and the replica will not be created.
                            The skip will be visible in the conditions, but the Replica will still be considered healthy.
                        - Fail
                            The reconciliation returns an error, which is also reflected in the conditions.
                            This causes the Replica to not become healthy unless the target namespace is created.
                      enum:
                      - Create
                      - Skip
                      - Fail
                      type: string
                    targetConflictPolicy:
                      description: |-
                        TargetConflictPolicy specifies what to do if the target resource already exists.
                        Valid values are:
                        - Overwrite
                            The existing target resource will be 'taken over' by the replica.
                            It will be overwritten and the replica will be responsible for it from then on.
                            Note that this policy still returns an error if the existing target resource is managed by another (Cluster)Replica, which still exists.
                        - Skip
                            The existing resource will remain unchanged and the replica will not be created.
                            The skip will be visible in the conditions, but the Replica will still be considered healthy.
                        - Fail (default)
                            The existing resource will remain unchanged and the replica will not be created.
                            The reconciliation returns an error, which is also reflected in the conditions.
                            This causes the Replica to not become healthy unless the conflicting resource is removed.
                      enum:
                      - Overwrite
                      - Skip
                      - Fail
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: at least one of cluster or namespace must be set
                    rule: has(self.cluster) || has(self.namespace)
                  - message: namespace selector cannot be set when cluster location
                      is 'NextTo'
                    rule: '!has(self.cluster) || !has(self.cluster.location) || self.cluster.location
                      != ''NextTo'' || !has(self.namespace)'
                maxItems: 10
                minItems: 1
                type: array
              template:
                description: |-
                  Template is a template for the target resource's manifest.
                  It can be omitted, if sources contains exactly one entry, and the target resource should be an exact copy of that source resource.
                  'Exact copy' excludes finalizers, owner references, status, and other fields where copying does not make sense (e.g. UID).

                  Note: If the target specifies a namespace, the 'metadata.namespace' field of the template will be ignored and the target namespace will be used instead.
                  Otherwise, the template must specify a namespace, unless the resource is cluster-scoped, or the template is omitted (in which case the source's namespace will be used).

                  Template is expected to be a go template.
                  It may be specified as an inline YAML mapping (with only some field values being templated, if any) or as a plain string.
                  If it is specified as yaml, it will be converted to a string before being passed to the template engine.

                  Available bindings in the template:
                  - sources.<id>: Manifest of the resource referenced by the source with the given ID.
                  - target: Information about the target resource which is currently being rendered. It contains the following fields:
                    - cluster: Information about the cluster the target resource is being rendered for. Can be empty, in which case the platform cluster is targeted. It contains the following fields:
                      - name: Name of the Cluster resource.
                      - namespace: Namespace of the Cluster resource.
                      - purposes: spec.purposes of the Cluster resource.
                    - namespace: Namespace of the target resource. Only available if a namespace selector is specified in the target definition; not set if the namespace is computed by the template itself.
                  - replica: Metadata information about this Replica resource. Contains fields for name, namespace, labels, and annotations.
                type: object
            required:
            - sources
            - targets
            type: object
            x-kubernetes-validations:
            - message: template is required when sources has more than one entry
              rule: has(self.template) || size(self.sources) == 1
          status:
            properties:
              conditions:
                description: Conditions contains the conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation of this resource
                  that was last reconciled by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the current phase of the resource.
                type: string
              replicas:
                description: |-
                  Replicas is a list of references to the resources which were created as replicas.
                  It is grouped by type, so that the operator can easily find all replicas of a given type.
                items:
                  properties:
                    resources:
                      description: Resources is a list of references to the created
                        resources of the given type.
                      items:
                        properties:
                          cluster:
                            description: |-
                              Cluster specifies the cluster where the replica was created.
                              If nil, the replica was created on the platform cluster (where the operator runs).
                            properties:
                              name:
                                description: Name is the name of the object.
                                type: string
                              namespace:
                                description: Namespace is the namespace of the object.
                                type: string
                            required:
                            - name
                            - namespace
                            type: object
                          name:
                            description: Name is the name of the object.
                            type: string
                          namespace:
                            description: Namespace is the namespace of the object.
                            type: string
                        required:
                        - name
                        type: object
                      type: array
                    type:
                      description: Type specifies the type of the created resources.
                      properties:
                        group:
                          type: string
                        kind:
                          type: string
                        version:
                          type: string
                      required:
                      - group
                      - kind
                      - version
                      type: object
                  required:
                  - resources
                  - type
                  type: object
                type: array
            required:
            - observedGeneration
            - phase
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
