# Cluster: platform
apiVersion: core.open-control-plane.io/v1alpha1
kind: Replica
metadata:
  name: imagepull-next-to
  namespace: test-01
spec:
  sources:
  - id: source
    group: ""
    version: v1
    kind: Secret
    name: imagepull
    namespace: registry
  template:
    apiVersion: v1
    kind: Secret
    metadata:
      name: "imagepull-{{ .target.cluster.name }}"
    type: "{{ .sources.source.type }}"
    data:
      .dockerconfigjson: "{{ index .sources.source.data \".dockerconfigjson\" }}"
  targets:
  - cluster:
      selector:
        matchPurposes:
        - operator: ContainsAll
          values:
          - controlplane
      location: NextTo
status:
  phase: Ready
  observedGeneration: 1
  conditions: [] # redacted
  replicas:
  - type:
      group: ""
      version: v1
      kind: Secret
    resources:
    - name: imagepull-cp-01
      namespace: user-01
    - name: imagepull-cp-01
      namespace: user-02
    - name: imagepull-cp-02
      namespace: user-02
