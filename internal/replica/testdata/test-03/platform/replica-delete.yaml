apiVersion: core.open-control-plane.io/v1alpha1
kind: Replica
metadata:
  name: test-replica-delete
  namespace: test-ns
  finalizers:
  - replica.core.open-control-plane.io/finalizer
spec:
  sources:
  - id: source
    group: ""
    version: v1
    kind: Secret
    name: source-secret
    namespace: test-ns
  targets:
  - namespace:
      selector:
        matchIdentities:
        - name: target-ns
status:
  replicas:
  - type:
      group: ""
      version: v1
      kind: Secret
    resources:
    - name: source-secret
      namespace: target-ns
