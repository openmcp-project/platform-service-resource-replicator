apiVersion: core.open-control-plane.io/v1alpha1
kind: Replica
metadata:
  name: test-replica-cluster-delete
  namespace: test-ns
  finalizers:
  - replica.core.open-control-plane.io/finalizer
spec:
  sources:
  - id: source
    group: ""
    version: v1
    kind: Secret
    name: source-secret
    namespace: test-ns
  targets:
  - cluster:
      selector:
        matchPurposes:
        - operator: ContainsAny
          values:
          - workload
  - cluster:
      selector:
        matchPurposes:
        - operator: ContainsAny
          values:
          - workload
      location: NextTo
status:
  replicas:
  - type:
      group: ""
      version: v1
      kind: Secret
    resources:
    - name: source-secret
      namespace: test-ns
      cluster:
        name: workload-cluster
        namespace: openmcp-system
    - name: source-secret
      namespace: openmcp-system
